[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tared"
dynamic = ["version"]
description = "Precision recipe formulation, batch scaling, and production management"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Tared Contributors" }]
dependencies = [
    "PyQt6>=6.5.0,<7.0.0",
]

[project.scripts]
tared = "tared.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
audit = [
    "mypy>=1.8",
    "coverage>=7.4",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.dynamic]
version = { attr = "tared.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tared" = ["assets/*", "printing/templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/tared"]

[tool.coverage.report]
skip_covered = true
show_missing = true
