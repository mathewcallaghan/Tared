name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (optional, defaults to v<version>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libegl1 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint check
        run: |
          ruff check .

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-and-release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libegl1 \
            libdbus-1-3 \
            libfuse2 \
            file

      - name: Install package and build requirements
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build AppImage binary
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./scripts/build_appimage.sh

      - name: Compute SHA-256 Checksums
        run: |
          APPIMAGE_BIN=$(ls Tared-*.AppImage | head -n 1)
          sha256sum "${APPIMAGE_BIN}" > "${APPIMAGE_BIN}.sha256"
          sha256sum "${APPIMAGE_BIN}" > SHA256SUMS

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(python3 -c "import re, pathlib; content = pathlib.Path('src/tared/__init__.py').read_text(); print(re.search(r'__version__\s*=\s*[\"\'\']([^\"\'\']+)[\"\'\']', content).group(1))")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            Tared-*.AppImage
            Tared-*.AppImage.sha256
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
