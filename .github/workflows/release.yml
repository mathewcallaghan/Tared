name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libegl1 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint check
        run: |
          ruff check .

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-and-release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libegl1 \
            libdbus-1-3 \
            libfuse2 \
            file

      - name: Install package and build requirements
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build AppImage binary
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./scripts/build_appimage.sh

      - name: Compute SHA-256 Checksums
        run: |
          APPIMAGE_BIN=$(ls Tared-*.AppImage | head -n 1)
          sha256sum "${APPIMAGE_BIN}" > "${APPIMAGE_BIN}.sha256"
          sha256sum "${APPIMAGE_BIN}" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Tared-*.AppImage
            Tared-*.AppImage.sha256
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
