name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libegl1 \
            libdbus-1-3

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check .

      - name: Run test suite (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libegl1 \
            libdbus-1-3 \
            libfuse2 \
            file

      - name: Build AppImage binary
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./scripts/build_appimage.sh

      - name: Verify generated AppImage artifact
        run: |
          APPIMAGE_BIN=$(ls Tared-*.AppImage | head -n 1)
          test -f "${APPIMAGE_BIN}"
          file "${APPIMAGE_BIN}"
          ./"${APPIMAGE_BIN}" --appimage-extract-and-run --help

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tared-linux-appimage
          path: Tared-*.AppImage
          if-no-files-found: error
